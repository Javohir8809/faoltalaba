          maxLength: 10000
        type:
          $ref: '#/components/schemas/TypeEnum'
        organizer:
          type: string
          format: uuid
          readOnly: true
        faculty:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          $ref: '#/components/schemas/AudienceEnum'
        audience_faculty:
          type: string
          format: uuid
          nullable: true
        audience_department:
          type: string
          format: uuid
          nullable: true
        audience_group:
          type: string
          format: uuid
          nullable: true
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          maxLength: 250
        registration_policy:
          $ref: '#/components/schemas/RegistrationPolicyEnum'
        attendance_policy:
          $ref: '#/components/schemas/AttendancePolicyEnum'
        evidence_required:
          type: boolean
        result_policy:
          $ref: '#/components/schemas/ResultPolicyEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organizer
      - published_at
      - state
      - title
      - type
      - updated_at
