openapi: 3.0.3
info:
  title: Faol Talaba API
  version: 1.0.0
  description: Faol Talaba modular monolith API. UTC timestamps; JSON transport.
paths:
  /api/v1/activities/:
    get:
      operationId: activities_list
      parameters:
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - ALL_STUDENTS
          - DEPARTMENT
          - FACULTY
          - GROUP
        description: |-
          * `ALL_STUDENTS` - All Students
          * `FACULTY` - Faculty
          * `DEPARTMENT` - Department
          * `GROUP` - Group
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: faculty
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - CANCELLED
          - COMPLETED
          - DRAFT
          - PENDING_APPROVAL
          - PUBLISHED
          - REGISTRATION_OPEN
          - REJECTED
          - SUSPENDED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_APPROVAL` - Pending Approval
          * `PUBLISHED` - Published
          * `REGISTRATION_OPEN` - Registration Open
          * `ACTIVE` - Active
          * `COMPLETED` - Completed
          * `ARCHIVED` - Archived
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
          * `SUSPENDED` - Suspended
      - in: query
        name: type
        schema:
          type: string
          enum:
          - CLUB
          - COMPETITION
          - CULTURE
          - ECO_SOCIAL
          - EVENT
          - INITIATIVE
          - INNOVATION
          - INTERNATIONAL
          - MEDIA
          - MENTORING
          - OTHER
          - PROFESSIONAL_DEVELOPMENT
          - SCIENCE
          - SPORT
          - VOLUNTEERING
        description: |-
          * `CLUB` - Club
          * `EVENT` - Event
          * `VOLUNTEERING` - Volunteering
          * `COMPETITION` - Competition
          * `SCIENCE` - Science
          * `SPORT` - Sport
          * `CULTURE` - Culture
          * `INNOVATION` - Innovation
          * `INTERNATIONAL` - International
          * `MENTORING` - Mentoring
          * `PROFESSIONAL_DEVELOPMENT` - Professional Development
          * `MEDIA` - Media
          * `ECO_SOCIAL` - Eco Social
          * `INITIATIVE` - Initiative
          * `OTHER` - Other
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: activities_create
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/{id}/:
    get:
      operationId: activities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    put:
      operationId: activities_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    patch:
      operationId: activities_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivity'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    delete:
      operationId: activities_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/activities/{id}/roles/:
    get:
      operationId: activities_roles_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityRoleList'
          description: ''
  /api/v1/activities/{id}/transitions/:
    post:
      operationId: activities_transitions_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/integrations/hemis/sync-status/:
    get:
      operationId: admin_integrations_hemis_sync_status_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - HEMIS
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSyncStateList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/admin/users/{id}/roles/:
    get:
      operationId: admin_users_roles_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleGrantList'
          description: ''
    post:
      operationId: admin_users_roles_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGrant'
          description: ''
  /api/v1/admin/users/{id}/roles/{grant_id}/:
    delete:
      operationId: admin_users_roles_destroy
      parameters:
      - in: path
        name: grant_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/status/:
    patch:
      operationId: admin_users_status_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStatus'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - Health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/ready/:
    get:
      operationId: ready_retrieve
      tags:
      - Health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TypeEnum'
        organizer:
          type: string
          format: uuid
          readOnly: true
        faculty:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          $ref: '#/components/schemas/AudienceEnum'
        audience_faculty:
          type: string
          format: uuid
          nullable: true
        audience_department:
          type: string
          format: uuid
          nullable: true
        audience_group:
          type: string
          format: uuid
          nullable: true
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          maxLength: 250
        registration_policy:
          $ref: '#/components/schemas/RegistrationPolicyEnum'
        attendance_policy:
          $ref: '#/components/schemas/AttendancePolicyEnum'
        evidence_required:
          type: boolean
        result_policy:
          $ref: '#/components/schemas/ResultPolicyEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organizer
      - published_at
      - state
      - title
      - type
      - updated_at
    ActivityRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grant:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          readOnly: true
      required:
      - grant
      - id
      - role
      - user_id
    AttendancePolicyEnum:
      enum:
      - NONE
      - REQUIRED
      type: string
      description: |-
        * `NONE` - None
        * `REQUIRED` - Required
    AudienceEnum:
      enum:
      - ALL_STUDENTS
      - FACULTY
      - DEPARTMENT
      - GROUP
      type: string
      description: |-
        * `ALL_STUDENTS` - All Students
        * `FACULTY` - Faculty
        * `DEPARTMENT` - Department
        * `GROUP` - Group
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required:
      - code
      - details
      - message
    GrantInput:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        scope_type:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scope_id:
          type: string
          format: uuid
          nullable: true
      required:
      - role
      - scope_type
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    HemisSyncStatusEnum:
      enum:
      - RUNNING
      - SUCCEEDED
      - FAILED
      type: string
      description: |-
        * `RUNNING` - Running
        * `SUCCEEDED` - Succeeded
        * `FAILED` - Failed
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 1024
      required:
      - password
      - username
    PaginatedActivityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    PaginatedActivityRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRole'
    PaginatedRoleGrantList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
    PaginatedSyncStateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncState'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TypeEnum'
        organizer:
          type: string
          format: uuid
          readOnly: true
        faculty:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        audience:
          $ref: '#/components/schemas/AudienceEnum'
        audience_faculty:
          type: string
          format: uuid
          nullable: true
        audience_department:
          type: string
          format: uuid
          nullable: true
        audience_group:
          type: string
          format: uuid
          nullable: true
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          maxLength: 250
        registration_policy:
          $ref: '#/components/schemas/RegistrationPolicyEnum'
        attendance_policy:
          $ref: '#/components/schemas/AttendancePolicyEnum'
        evidence_required:
          type: boolean
        result_policy:
          $ref: '#/components/schemas/ResultPolicyEnum'
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedStatus:
      type: object
      properties:
        is_active:
          type: boolean
    Refresh:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          maxLength: 4096
      required:
      - refresh
    RegistrationPolicyEnum:
      enum:
      - NONE
      - OPEN
      - APPROVAL
      type: string
      description: |-
        * `NONE` - None
        * `OPEN` - Open
        * `APPROVAL` - Approval
    ResourceEnum:
      enum:
      - faculties
      - departments
      - groups
      - subjects
      - students
      - staff
      type: string
      description: |-
        * `faculties` - Faculties
        * `departments` - Departments
        * `groups` - Groups
        * `subjects` - Subjects
        * `students` - Students
        * `staff` - Staff
    ResultPolicyEnum:
      enum:
      - NONE
      - VERIFIED_PARTICIPATION
      type: string
      description: |-
        * `NONE` - None
        * `VERIFIED_PARTICIPATION` - Verified Participation
    RoleEnum:
      enum:
      - SUPERADMIN
      - YOUTH_ADMIN
      - FACULTY_YOUTH_RESPONSIBLE
      - DEPARTMENT_RESPONSIBLE
      - CLUB_LEADER
      - ACTIVITY_RESPONSIBLE
      - TEACHER
      - STUDENT
      - SCIENCE_OFFICE
      - SPORTS_OFFICE
      - INTERNATIONAL_OFFICE
      - LIBRARY_OPERATOR
      - ANALYTICS_VIEWER
      type: string
      description: |-
        * `SUPERADMIN` - Superadmin
        * `YOUTH_ADMIN` - Youth Admin
        * `FACULTY_YOUTH_RESPONSIBLE` - Faculty Youth Responsible
        * `DEPARTMENT_RESPONSIBLE` - Department Responsible
        * `CLUB_LEADER` - Club Leader
        * `ACTIVITY_RESPONSIBLE` - Activity Responsible
        * `TEACHER` - Teacher
        * `STUDENT` - Student
        * `SCIENCE_OFFICE` - Science Office
        * `SPORTS_OFFICE` - Sports Office
        * `INTERNATIONAL_OFFICE` - International Office
        * `LIBRARY_OPERATOR` - Library Operator
