openapi: 3.0.3
info:
  title: Faol Talaba API
  version: 1.0.0
  description: Faol Talaba modular monolith API. UTC timestamps; JSON transport.
paths:
  /api/v1/activities/:
    get:
      operationId: activities_list
      parameters:
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - ALL_STUDENTS
          - DEPARTMENT
          - FACULTY
          - GROUP
        description: |-
          * `ALL_STUDENTS` - All Students
          * `FACULTY` - Faculty
          * `DEPARTMENT` - Department
          * `GROUP` - Group
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: faculty
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - CANCELLED
          - COMPLETED
          - DRAFT
          - PENDING_APPROVAL
          - PUBLISHED
          - REGISTRATION_OPEN
          - REJECTED
          - SUSPENDED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_APPROVAL` - Pending Approval
          * `PUBLISHED` - Published
          * `REGISTRATION_OPEN` - Registration Open
          * `ACTIVE` - Active
          * `COMPLETED` - Completed
          * `ARCHIVED` - Archived
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
          * `SUSPENDED` - Suspended
      - in: query
        name: type
        schema:
          type: string
          enum:
          - CLUB
          - COMPETITION
          - CULTURE
          - ECO_SOCIAL
          - EVENT
          - INITIATIVE
          - INNOVATION
          - INTERNATIONAL
          - MEDIA
          - MENTORING
          - OTHER
          - PROFESSIONAL_DEVELOPMENT
          - SCIENCE
          - SPORT
          - VOLUNTEERING
        description: |-
          * `CLUB` - Club
          * `EVENT` - Event
          * `VOLUNTEERING` - Volunteering
          * `COMPETITION` - Competition
          * `SCIENCE` - Science
          * `SPORT` - Sport
          * `CULTURE` - Culture
          * `INNOVATION` - Innovation
          * `INTERNATIONAL` - International
          * `MENTORING` - Mentoring
          * `PROFESSIONAL_DEVELOPMENT` - Professional Development
          * `MEDIA` - Media
          * `ECO_SOCIAL` - Eco Social
          * `INITIATIVE` - Initiative
          * `OTHER` - Other
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: activities_create
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
